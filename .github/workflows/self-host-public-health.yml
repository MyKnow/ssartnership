name: Self-host Public HTTPS Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Independent public HTTPS checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.1
      - name: Verify fixed public origins without credentials or retries
        run: node scripts/self-host-operations/verify-public-health.mjs
