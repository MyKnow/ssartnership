name: Storybook and Visual Baselines

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect visual changes
    runs-on: ubuntu-latest
    outputs:
      visual: ${{ steps.visual.outputs.changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect screenshot-affecting changes
        id: visual
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PULL_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PULL_BASE_SHA"
            head_sha="$PULL_HEAD_SHA"
          else
            base_sha="$PUSH_BASE_SHA"
            head_sha="$CURRENT_SHA"
          fi

          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=false
          while IFS= read -r pathname; do
            case "$pathname" in
              src/*|public/*|.storybook/*|tests/visual/*|package.json|package-lock.json|next.config.ts|postcss.config.*|tailwind.config.*|playwright.visual.config.ts)
                changed=true
                break
                ;;
            esac
          done < <(git diff --name-only --diff-filter=ACMRTD "$base_sha" "$head_sha")

          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  interaction:
    name: Build, Interaction, A11y
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        run: npm run build-storybook

      - name: Install fixed Chromium
        run: npx playwright install --with-deps chromium

      - name: Storybook interaction and a11y tests
        run: npm run test-storybook

  visual:
    name: Visual Baselines
    needs: changes
    if: needs.changes.outputs.visual == 'true'
    # Screenshot baselines are generated with CoreText. Keep the pixel job
    # aligned with that renderer so font metrics do not vary with FreeType.
    runs-on: macos-14
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install fixed Chromium
        run: npx playwright install chromium

      - name: Compare core visual baselines
        run: npm run test:visual
