name: Storybook and Visual Baselines

on:
  workflow_dispatch:
    inputs:
      interaction:
        description: Build Storybook and run interaction/accessibility tests.
        required: false
        default: true
        type: boolean
      visual:
        description: Compare the reviewed visual baselines.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: storybook-manual
  cancel-in-progress: false

jobs:
  interaction:
    if: ${{ inputs.interaction }}
    name: Build, Interaction, A11y
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        env:
          NPM_CONFIG_CACHE: ${{ github.workspace }}/.tmp/npm-cache
        with:
          node-version: 24.18.1
          cache: npm

      - name: Install trusted dependencies
        run: npm run install:trusted

      - name: Build Storybook
        run: npm run build-storybook

      - name: Install fixed Chromium
        run: npx playwright install --with-deps chromium

      - name: Storybook interaction and a11y tests
        run: npm run test-storybook

  visual:
    if: ${{ inputs.visual }}
    name: Visual Baselines
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        env:
          NPM_CONFIG_CACHE: ${{ github.workspace }}/.tmp/npm-cache
        with:
          node-version: 24.18.1
          cache: npm

      - name: Install trusted dependencies
        run: npm run install:trusted

      - name: Install fixed Chromium
        run: npx playwright install --with-deps chromium

      - name: Compare core visual baselines
        run: npm run test:visual
