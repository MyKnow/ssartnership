name: Storybook and Visual Baselines

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  interaction:
    name: Build, Interaction, A11y
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        run: npm run build-storybook

      - name: Install fixed Chromium
        run: npx playwright install --with-deps chromium

      - name: Storybook interaction and a11y tests
        run: npm run test-storybook

  visual:
    name: Visual Baselines
    # Screenshot baselines are generated with CoreText. Keep the pixel job
    # aligned with that renderer so font metrics do not vary with FreeType.
    runs-on: macos-14
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install fixed Chromium
        run: npx playwright install chromium

      - name: Compare core visual baselines
        run: npm run test:visual
