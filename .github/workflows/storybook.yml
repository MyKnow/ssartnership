name: Storybook and Visual Baselines

on:
  push:
    branches: [main, dev]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  interaction:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    name: Build, Interaction, A11y
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        env:
          NPM_CONFIG_CACHE: ${{ github.workspace }}/.tmp/npm-cache
        with:
          node-version: 24.18.1
          cache: npm

      - name: Install trusted dependencies
        run: npm run install:trusted

      - name: Build Storybook
        run: npm run build-storybook

      - name: Install fixed Chromium
        run: npx playwright install --with-deps chromium

      - name: Storybook interaction and a11y tests
        run: npm run test-storybook

  visual:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: Visual Baselines
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        env:
          NPM_CONFIG_CACHE: ${{ github.workspace }}/.tmp/npm-cache
        with:
          node-version: 24.18.1
          cache: npm

      - name: Install trusted dependencies
        run: npm run install:trusted

      - name: Install fixed Chromium
        run: npx playwright install --with-deps chromium

      - name: Compare core visual baselines
        run: npm run test:visual
