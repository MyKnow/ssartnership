name: Sync Preview Supabase

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type SYNC_PREVIEW_DATA to replace Preview data and Storage from Production.
        required: true
        type: string
      expected_dev_sha:
        description: Exact current dev commit SHA approved for the Preview sync.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: preview-data-sync
  cancel-in-progress: false

jobs:
  sync-preview:
    if: >-
      ${{
        github.ref == 'refs/heads/main' &&
        inputs.confirmation == 'SYNC_PREVIEW_DATA'
      }}
    name: Replace Preview data and Storage
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Select exact dev revision
        id: select-dev
        shell: bash
        env:
          EXPECTED_DEV_SHA: ${{ inputs.expected_dev_sha }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -euo pipefail
          live_dev_sha="$(git ls-remote "$REPOSITORY_URL" refs/heads/dev | awk '{print $1}')"
          if [[ ! "$EXPECTED_DEV_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$EXPECTED_DEV_SHA" != "$live_dev_sha" ]]; then
            echo "::error::The approved dev commit does not match current origin/dev."
            exit 1
          fi
          echo "sha=$EXPECTED_DEV_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout selected dev revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.select-dev.outputs.sha }}
          persist-credentials: false

      - name: Verify selected dev revision
        shell: bash
        env:
          EXPECTED_DEV_SHA: ${{ steps.select-dev.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_DEV_SHA"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        env:
          NPM_CONFIG_CACHE: ${{ github.workspace }}/.tmp/npm-cache
        with:
          node-version: 24.18.1
          cache: npm

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install trusted dependencies
        run: npm run install:trusted

      - name: Validate Supabase migrations
        run: npm run validate:migrations

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.114.0
          github-token: ${{ github.token }}

      - name: Check preview database connection
        id: preview-db
        env:
          SUPABASE_PREVIEW_DB_URL: ${{ secrets.SUPABASE_PREVIEW_DB_URL }}
        run: node scripts/supabase-sync-preview.mjs --check-only

      - name: Apply preview migrations before sync
        env:
          EXPECTED_DEV_SHA: ${{ steps.select-dev.outputs.sha }}
          SUPABASE_PREVIEW_DB_URL: ${{ secrets.SUPABASE_PREVIEW_DB_URL }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_DEV_SHA"
          test "$(git ls-remote origin refs/heads/dev | awk '{print $1}')" = "$EXPECTED_DEV_SHA"
          supabase db push --db-url "$SUPABASE_PREVIEW_DB_URL" --yes --include-all

      - name: Sync production data and storage to preview
        id: sync-preview-data
        env:
          SUPABASE_PRODUCTION_DB_URL: ${{ secrets.SUPABASE_PRODUCTION_DB_URL }}
          SUPABASE_PRODUCTION_URL: ${{ secrets.SUPABASE_PRODUCTION_URL }}
          SUPABASE_PRODUCTION_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_PRODUCTION_SERVICE_ROLE_KEY }}
          SUPABASE_PREVIEW_DB_URL: ${{ secrets.SUPABASE_PREVIEW_DB_URL }}
          SUPABASE_PREVIEW_URL: ${{ secrets.SUPABASE_PREVIEW_URL }}
          SUPABASE_PREVIEW_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_PREVIEW_SERVICE_ROLE_KEY }}
          PREVIEW_TEST_MEMBER_USERNAME: ${{ secrets.PREVIEW_TEST_MEMBER_USERNAME }}
          PREVIEW_TEST_MEMBER_PASSWORD: ${{ secrets.PREVIEW_TEST_MEMBER_PASSWORD }}
        run: npm run sync:preview

      - name: Verify preview migrations after sync
        env:
          EXPECTED_DEV_SHA: ${{ steps.select-dev.outputs.sha }}
          SUPABASE_PREVIEW_DB_URL: ${{ secrets.SUPABASE_PREVIEW_DB_URL }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_DEV_SHA"
          test "$(git ls-remote origin refs/heads/dev | awk '{print $1}')" = "$EXPECTED_DEV_SHA"
          supabase db push --db-url "$SUPABASE_PREVIEW_DB_URL" --yes --include-all
