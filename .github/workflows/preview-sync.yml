name: Sync Preview Supabase

on:
  workflow_run:
    workflows:
      - Public Readiness
    branches: [dev]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-sync
  cancel-in-progress: false

jobs:
  sync-preview:
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev') ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'dev'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout workflow run commit
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Checkout selected ref
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Guard stale dev workflow SHA
        if: github.event_name == 'workflow_run'
        id: stale-sha
        shell: bash
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current_dev_sha="$(git ls-remote origin refs/heads/dev | awk '{print $1}')"
          if [[ -z "$current_dev_sha" ]]; then
            echo "::error::Could not resolve origin/dev while validating the triggering workflow SHA."
            exit 1
          fi

          if [[ "$current_dev_sha" != "$RUN_SHA" ]]; then
            echo "is_current=false" >> "$GITHUB_OUTPUT"
            echo "Preview sync skipped because dev advanced from $RUN_SHA to $current_dev_sha."
            exit 0
          fi

          echo "is_current=true" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: github.event_name != 'workflow_run' || steps.stale-sha.outputs.is_current == 'true'
        uses: actions/setup-node@v7
        env:
          NPM_CONFIG_CACHE: ${{ github.workspace }}/.tmp/npm-cache
        with:
          node-version: 24.18.1
          cache: npm

      - name: Install PostgreSQL client
        if: github.event_name != 'workflow_run' || steps.stale-sha.outputs.is_current == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install trusted dependencies
        if: github.event_name != 'workflow_run' || steps.stale-sha.outputs.is_current == 'true'
        run: npm run install:trusted

      - name: Validate Supabase migrations
        if: github.event_name != 'workflow_run' || steps.stale-sha.outputs.is_current == 'true'
        run: npm run validate:migrations

      - name: Set up Supabase CLI
        if: github.event_name != 'workflow_run' || steps.stale-sha.outputs.is_current == 'true'
        uses: supabase/setup-cli@v2
        with:
          version: 2.114.0
          github-token: ${{ github.token }}

      - name: Check preview database connection
        if: github.event_name != 'workflow_run' || steps.stale-sha.outputs.is_current == 'true'
        id: preview-db
        env:
          SUPABASE_PREVIEW_DB_URL: ${{ secrets.SUPABASE_PREVIEW_DB_URL }}
          SUPABASE_PREVIEW_SYNC_SKIP_UNAVAILABLE: ${{ github.event_name == 'workflow_run' && 'true' || 'false' }}
        run: node scripts/supabase-sync-preview.mjs --check-only

      - name: Apply preview migrations before sync
        if: (github.event_name != 'workflow_run' || steps.stale-sha.outputs.is_current == 'true') && steps.preview-db.outputs.preview_database_available != 'false'
        env:
          SUPABASE_PREVIEW_DB_URL: ${{ secrets.SUPABASE_PREVIEW_DB_URL }}
        run: supabase db push --db-url "$SUPABASE_PREVIEW_DB_URL" --yes --include-all

      - name: Sync production data and storage to preview
        id: sync-preview-data
        if: (github.event_name != 'workflow_run' || steps.stale-sha.outputs.is_current == 'true') && steps.preview-db.outputs.preview_database_available != 'false'
        env:
          SUPABASE_PRODUCTION_DB_URL: ${{ secrets.SUPABASE_PRODUCTION_DB_URL }}
          SUPABASE_PRODUCTION_URL: ${{ secrets.SUPABASE_PRODUCTION_URL }}
          SUPABASE_PRODUCTION_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_PRODUCTION_SERVICE_ROLE_KEY }}
          SUPABASE_PREVIEW_DB_URL: ${{ secrets.SUPABASE_PREVIEW_DB_URL }}
          SUPABASE_PREVIEW_URL: ${{ secrets.SUPABASE_PREVIEW_URL }}
          SUPABASE_PREVIEW_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_PREVIEW_SERVICE_ROLE_KEY }}
          PREVIEW_TEST_MEMBER_USERNAME: ${{ secrets.PREVIEW_TEST_MEMBER_USERNAME }}
          PREVIEW_TEST_MEMBER_PASSWORD: ${{ secrets.PREVIEW_TEST_MEMBER_PASSWORD }}
          SUPABASE_PREVIEW_SYNC_SKIP_UNAVAILABLE: ${{ github.event_name == 'workflow_run' && 'true' || 'false' }}
        run: npm run sync:preview

      - name: Verify preview migrations after sync
        if: (github.event_name != 'workflow_run' || steps.stale-sha.outputs.is_current == 'true') && steps.preview-db.outputs.preview_database_available != 'false'
        env:
          SUPABASE_PREVIEW_DB_URL: ${{ secrets.SUPABASE_PREVIEW_DB_URL }}
        run: supabase db push --db-url "$SUPABASE_PREVIEW_DB_URL" --yes --include-all
