name: Apply Preview Supabase Migrations

# Push-triggered runs use explicit commit markers so migration repair/apply is intentional.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/preview-migrations.yml"
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type APPLY_PREVIEW_MIGRATIONS to apply pending dev migrations to Preview.
        required: true
        type: string
      expected_dev_sha:
        description: Exact current dev commit SHA approved for Preview migration.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: preview-supabase-migrations
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      ${{
        github.ref == 'refs/heads/main' &&
        (
          (
            github.event_name == 'push' &&
            contains(github.event.head_commit.message, '[apply-preview-migrations]')
          ) ||
          (
            github.event_name == 'workflow_dispatch' &&
            inputs.confirmation == 'APPLY_PREVIEW_MIGRATIONS'
          )
        )
      }}
    name: Validate and apply Preview migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Select exact dev revision
        id: select-dev
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_EXPECTED_DEV_SHA: ${{ inputs.expected_dev_sha }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -euo pipefail
          live_dev_sha="$(git ls-remote "$REPOSITORY_URL" refs/heads/dev | awk '{print $1}')"
          if [[ ! "$live_dev_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve a valid origin/dev commit."
            exit 1
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            expected_dev_sha="$INPUT_EXPECTED_DEV_SHA"
          else
            expected_dev_sha="$live_dev_sha"
          fi
          if [[ ! "$expected_dev_sha" =~ ^[0-9a-f]{40}$ ]] || [[ "$expected_dev_sha" != "$live_dev_sha" ]]; then
            echo "::error::The approved dev commit does not match current origin/dev."
            exit 1
          fi
          echo "sha=$expected_dev_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout selected dev revision
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.select-dev.outputs.sha }}
          persist-credentials: false

      - name: Verify selected dev revision
        shell: bash
        env:
          EXPECTED_DEV_SHA: ${{ steps.select-dev.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_DEV_SHA"

      - name: Setup Node
        uses: actions/setup-node@v7
        env:
          NPM_CONFIG_CACHE: ${{ github.workspace }}/.tmp/npm-cache
        with:
          node-version: 24.18.1
          cache: npm

      - name: Install trusted dependencies
        run: npm run install:trusted

      - name: Validate migration files
        run: npm run validate:migrations

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.114.0
          github-token: ${{ github.token }}

      - name: List Preview migrations before apply
        env:
          SUPABASE_PREVIEW_DB_URL: ${{ secrets.SUPABASE_PREVIEW_DB_URL }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_PREVIEW_DB_URL"
          supabase migration list --db-url "$SUPABASE_PREVIEW_DB_URL"

      - name: Repair stale Preview migration history
        if: >-
          ${{
            github.event_name == 'push' &&
            contains(github.event.head_commit.message, '[repair-preview-migration-history]')
          }}
        env:
          EXPECTED_DEV_SHA: ${{ steps.select-dev.outputs.sha }}
          SUPABASE_PREVIEW_DB_URL: ${{ secrets.SUPABASE_PREVIEW_DB_URL }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_DEV_SHA"
          test "$(git ls-remote origin refs/heads/dev | awk '{print $1}')" = "$EXPECTED_DEV_SHA"
            supabase migration repair \
            --status reverted \
            --db-url "$SUPABASE_PREVIEW_DB_URL" \
            --yes \
            20260712133729 20260712143858 20260720121433

      - name: Apply pending Preview migrations
        env:
          EXPECTED_DEV_SHA: ${{ steps.select-dev.outputs.sha }}
          SUPABASE_PREVIEW_DB_URL: ${{ secrets.SUPABASE_PREVIEW_DB_URL }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_DEV_SHA"
          test "$(git ls-remote origin refs/heads/dev | awk '{print $1}')" = "$EXPECTED_DEV_SHA"
          supabase db push --db-url "$SUPABASE_PREVIEW_DB_URL" --yes

      - name: Verify Preview migrations after apply
        env:
          SUPABASE_PREVIEW_DB_URL: ${{ secrets.SUPABASE_PREVIEW_DB_URL }}
        run: |
          set -euo pipefail
          supabase migration list --db-url "$SUPABASE_PREVIEW_DB_URL"
