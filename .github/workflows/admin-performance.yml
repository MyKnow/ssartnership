name: Measure Admin Preview Performance

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type MEASURE_ADMIN_PERFORMANCE to collect Preview administrator performance.
        required: true
        type: string
      iterations:
        description: Number of sequential requests per authenticated page and API probes target (1-100).
        required: false
        default: "30"
        type: string
      page_targets:
        description: Optional JSON array of authenticated page probes to measure.
        required: false
        default: ""
        type: string
      api_targets:
        description: Optional JSON array of authenticated API probes to measure.
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: admin-preview-performance
  cancel-in-progress: false

jobs:
  measure:
    if: >-
      ${{
        github.ref == 'refs/heads/dev' &&
        inputs.confirmation == 'MEASURE_ADMIN_PERFORMANCE'
      }}
    name: Collect Preview administrator performance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout dispatched dev revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify dispatched dev revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        env:
          NPM_CONFIG_CACHE: ${{ github.workspace }}/.tmp/npm-cache
        with:
          node-version: 24.18.1
          cache: npm

      - name: Install trusted dependencies
        run: npm run install:trusted

      - name: Validate migration files
        run: npm run validate:migrations

      - name: Measure Preview administrator performance
        env:
          SUPABASE_PREVIEW_URL: ${{ secrets.SUPABASE_PREVIEW_URL }}
          SUPABASE_PREVIEW_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_PREVIEW_SERVICE_ROLE_KEY }}
          ADMIN_PREVIEW_URL: https://ssartnership-dev.myknow.xyz
          ADMIN_PREVIEW_SESSION_COOKIE: ${{ secrets.ADMIN_PREVIEW_SESSION_COOKIE }}
          ADMIN_PREVIEW_PROTECTION_BYPASS: ${{ secrets.ADMIN_PREVIEW_PROTECTION_BYPASS }}
          ADMIN_PREVIEW_BASIC_AUTH_USERNAME: ${{ secrets.ADMIN_PREVIEW_BASIC_AUTH_USERNAME }}
          ADMIN_PREVIEW_BASIC_AUTH_PASSWORD: ${{ secrets.ADMIN_PREVIEW_BASIC_AUTH_PASSWORD }}
          ADMIN_PREVIEW_LOGIN_USERNAME: ${{ secrets.PREVIEW_TEST_MEMBER_USERNAME }}
          ADMIN_PREVIEW_LOGIN_PASSWORD: ${{ secrets.PREVIEW_TEST_MEMBER_PASSWORD }}
          ADMIN_PREVIEW_ITERATIONS: ${{ inputs.iterations }}
          ADMIN_PREVIEW_PAGE_TARGETS: ${{ inputs.page_targets }}
          ADMIN_PREVIEW_API_TARGETS: ${{ inputs.api_targets }}
        run: npm run measure:admin:preview
