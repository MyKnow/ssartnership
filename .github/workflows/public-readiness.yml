name: Public Readiness

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      release_gate:
        description: Run the Production release build and full E2E gate.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: Quick Readiness
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        env:
          NPM_CONFIG_CACHE: ${{ github.workspace }}/.tmp/npm-cache
        with:
          node-version: 24.18.1
          cache: npm

      - name: Install trusted dependencies
        run: npm run install:trusted

      - name: Verify lockfile
        run: npm run check:lockfile

      - name: Validate migrations
        run: npm run validate:migrations

      - name: Lint
        run: npm run lint

      - name: TypeScript syntax check
        run: npm run typecheck:ci

      - name: Unit tests
        run: npm test

      - name: Security audit
        run: npm run audit:security

  release:
    if: >-
      ${{
        (github.event_name == 'pull_request' && github.base_ref == 'main') ||
        (github.event_name == 'workflow_dispatch' && inputs.release_gate)
      }}
    needs: quick
    name: Release Readiness
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        env:
          NPM_CONFIG_CACHE: ${{ github.workspace }}/.tmp/npm-cache
        with:
          node-version: 24.18.1
          cache: npm

      - name: Install trusted dependencies
        run: npm run install:trusted

      - name: Production build and full E2E
        env:
          PLAYWRIGHT_CHROMIUM_CHANNEL: chrome
        run: npm run verify:release:post-quick
