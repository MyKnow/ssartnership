groups:
  - name: pve-service
    rules:
      - alert: ExporterDown
        expr: up{environment!="preview"} == 0
        for: 2m
        labels: { severity: critical }
      - alert: ExporterDown
        expr: up{environment="preview"} == 0
        for: 2m
        labels: { severity: warning }
      - alert: AppHealthFailed
        expr: (ssartnership_app_probe_success{vm!="",environment!="preview"} == 0) or (time() - ssartnership_app_probe_completed_seconds{vm!="",environment!="preview"} > 90)
        for: 2m
        labels: { severity: critical }
      - alert: AppHealthFailed
        expr: (ssartnership_app_probe_success{vm!="",environment="preview"} == 0) or (time() - ssartnership_app_probe_completed_seconds{vm!="",environment="preview"} > 90)
        for: 2m
        labels: { severity: warning }
      # Readiness (gateway, Storage, database) seen from the app container.
      # Liveness stays AppHealthFailed; Alertmanager inhibits this alert while
      # the app itself is down so one outage sends one notice.
      - alert: AppDependencyUnavailable
        expr: ssartnership_app_ready_success{vm!="",environment!="preview"} == 0
        for: 2m
        labels: { severity: critical }
      - alert: AppDependencyUnavailable
        expr: ssartnership_app_ready_success{vm!="",environment="preview"} == 0
        for: 2m
        labels: { severity: warning }
      - alert: DatabaseUnavailable
        expr: pg_up{environment!="preview"} == 0
        for: 1m
        labels: { severity: critical }
      - alert: DatabaseUnavailable
        expr: pg_up{environment="preview"} == 0
        for: 1m
        labels: { severity: warning }
      # Production cron completion (node-exporter textfile on the app VM).
      # Stale means no success for three expected intervals: a stopped timer,
      # a missing unit or repeated failures. Single failures already page via
      # the unit's OnFailure notice.
      - alert: ProductionCronStale
        expr: time() - ssartnership_production_cron_last_success_seconds > 3 * ssartnership_production_cron_interval_seconds
        for: 10m
        labels: { severity: warning }
      # Release receiver timer (every 5 minutes). Lock conflicts are skipped
      # polls (exit 75) and do not reset or fail the success timestamp.
      - alert: ReleaseReceiverStale
        expr: time() - ssartnership_release_receiver_last_success_seconds > 3600
        for: 10m
        labels: { severity: warning }
      # postgres-exporter defaults: stat_database numbackends, pg_settings and
      # database size. Verify the names against the live :9187 output when
      # applying; a missing series keeps these rules silent, not firing.
      - alert: DatabaseConnectionsHigh
        expr: sum by (environment, vm) (pg_stat_database_numbackends) / on(environment, vm) max by (environment, vm) (pg_settings_max_connections) > 0.8
        for: 10m
        labels: { severity: warning }
      # Growth over the last day projected 14 days ahead exceeds the free space
      # on the VM root filesystem that holds the Docker data volume.
      - alert: DatabaseSizeForecast
        expr: >-
          (
            predict_linear(sum by (environment, vm) (pg_database_size_bytes)[1d:10m], 14 * 86400)
            - sum by (environment, vm) (pg_database_size_bytes)
          )
          > on(environment, vm) max by (environment, vm) (node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"})
        for: 1h
        labels: { severity: warning }
      - alert: HostDiskLow
        expr: node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes < 0.15
        for: 5m
        labels: { severity: critical }
      - alert: HostMemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.1
        for: 5m
        labels: { severity: warning }
      - alert: HostCpuBusy
        expr: 1 - avg by (environment, vm) (rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.9
        for: 10m
        labels: { severity: warning }
      - alert: AlertDeliveryUnavailable
        expr: (ssartnership_notifier_configured == 0) or (increase(ssartnership_notifier_deliveries_total{result="failure"}[10m]) > 0)
        for: 2m
        labels: { severity: critical }
      - alert: PveHostCollectorStale
        expr: (time() - myknow_pve_collected_seconds > 300) or absent(myknow_pve_collected_seconds)
        for: 2m
        labels: { severity: warning, environment: operations, vm: host }
      - alert: PveDiskUnhealthy
        expr: (myknow_pve_system_disk_healthy == 0) or (myknow_pve_backup_disk_healthy == 0)
        for: 2m
        labels: { severity: critical, environment: operations, vm: host }
      - alert: PveThinPoolLow
        expr: (myknow_pve_thin_data_used_ratio > 0.85) or (myknow_pve_thin_metadata_used_ratio > 0.85)
        for: 5m
        labels: { severity: critical, environment: operations, vm: host }
      - alert: IngressEndpointDown
        expr: ssartnership_ingress_probe_success{environment="production"} == 0
        for: 2m
        labels: { severity: critical }
      - alert: IngressEndpointDown
        expr: ssartnership_ingress_probe_success{environment="preview"} == 0
        for: 2m
        labels: { severity: warning }
      - alert: CertificateExpiring
        expr: ssartnership_ingress_probe_expires - time() < 1209600 and ssartnership_ingress_probe_expires > 0
        for: 10m
        labels: { severity: warning }
      # Upstream 5xx share at the public edge. sum() drops target labels, so
      # the shared edge identity is attached explicitly. The request floor
      # (0.05 req/s, about 15 requests per 5 minutes) keeps a single failed
      # request at night from paging; thresholds are provisional baselines.
      - alert: ServerErrorBurst
        expr: >-
          (
            sum(rate(caddy_http_request_duration_seconds_count{job="caddy",handler="reverse_proxy",code=~"5.."}[5m]))
            / sum(rate(caddy_http_request_duration_seconds_count{job="caddy",handler="reverse_proxy"}[5m]))
            > 0.05
          )
          and sum(rate(caddy_http_request_duration_seconds_count{job="caddy",handler="reverse_proxy"}[5m])) > 0.05
        for: 5m
        labels: { severity: warning, environment: operations, vm: "5202" }
