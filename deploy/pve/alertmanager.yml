global:
  resolve_timeout: 5m
route:
  receiver: production
  group_by: [alertname, environment]
  group_wait: 15s
  group_interval: 1m
  repeat_interval: 4h
  routes:
    - matchers: ['environment="preview"']
      receiver: preview
      group_wait: 1m
      repeat_interval: 12h
inhibit_rules:
  - source_matchers: ['alertname="ExporterDown"', 'job="telemetry"']
    target_matchers: ['alertname="AppHealthFailed"']
    equal: [environment, vm]
  - source_matchers: ['alertname="ExporterDown"', 'job="postgres"']
    target_matchers: ['alertname="DatabaseUnavailable"']
    equal: [environment, vm]
receivers:
  - name: production
    webhook_configs:
      - url: http://notifier:9465/alerts
        send_resolved: true
        max_alerts: 20
        http_config:
          follow_redirects: false
          authorization:
            credentials_file: /run/production-alert-relay-token
  - name: preview
    webhook_configs:
      - url: http://notifier:9465/alerts
        send_resolved: true
        max_alerts: 20
        http_config:
          follow_redirects: false
          authorization:
            credentials_file: /run/production-alert-relay-token
