name: ssartnership-legacy-relay
services:
  relay:
    image: caddy:2.11.4@sha256:98eb57d882ccd5213d1688764db10c1ca2c58a1ca3a6717a3411ad798f7a423a
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 64
    logging:
      driver: local
      options: { max-size: 10m, max-file: "3" }
    tmpfs: [/data:size=16m, /config:size=16m]
    ports: ["192.168.1.191:9080:9080"]
    volumes: ["./legacy.Caddyfile:/etc/caddy/Caddyfile:ro"]
    networks: [legacy-edge]
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:19000/health]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  legacy-edge:
    external: true
    name: ssartnership-production-data_edge
