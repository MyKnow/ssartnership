global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    service: ssartnership
rule_files: [/etc/prometheus/*alerts.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]
        labels: { environment: operations, vm: "5202" }
  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]
        labels: { environment: operations, vm: "5202" }
      - targets: [192.168.1.182:9100]
        labels: { environment: production, vm: "5200" }
      - targets: [192.168.1.69:9100]
        labels: { environment: preview, vm: "5201" }
  - job_name: postgres
    static_configs:
      - targets: [192.168.1.182:9187]
        labels: { environment: production, vm: "5200" }
      - targets: [192.168.1.69:9187]
        labels: { environment: preview, vm: "5201" }
  - job_name: telemetry
    static_configs:
      - targets: [192.168.1.182:9464]
        labels: { environment: production, vm: "5200" }
      - targets: [192.168.1.69:9464]
        labels: { environment: preview, vm: "5201" }
  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]
        labels: { environment: operations, vm: "5202" }
  - job_name: notifier
    static_configs:
      - targets: [notifier:9465]
        labels: { environment: operations, vm: "5202" }
  - job_name: pve-host
    metrics_path: /host-metrics
    static_configs:
      - targets: [notifier:9465]
        labels: { environment: operations, vm: host }
  - job_name: observer
    static_configs:
      - targets: [observer:9466]
        labels: { environment: operations, vm: "5202" }
    honor_labels: true
