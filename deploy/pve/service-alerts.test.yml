rule_files: [service-alerts.yml]
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'up{job="telemetry",environment="production",vm="5200"}'
        values: '0 0 0 1 1 1'
      - series: 'up{job="telemetry",environment="preview",vm="5201"}'
        values: '0 0 0 1 1 1'
    alert_rule_test:
      - eval_time: 2m
        alertname: ExporterDown
        exp_alerts:
          - exp_labels: { job: telemetry, environment: production, vm: "5200", severity: critical }
          - exp_labels: { job: telemetry, environment: preview, vm: "5201", severity: warning }
      - eval_time: 4m
        alertname: ExporterDown
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'ssartnership_app_probe_success{environment="production",vm="5200"}'
        values: '0 0 0 1 1 1'
      - series: 'pg_up{environment="preview",vm="5201"}'
        values: '0 0 0 1 1 1'
    alert_rule_test:
      - eval_time: 2m
        alertname: AppHealthFailed
        exp_alerts:
          - exp_labels: { environment: production, vm: "5200", severity: critical }
      - eval_time: 2m
        alertname: DatabaseUnavailable
        exp_alerts:
          - exp_labels: { environment: preview, vm: "5201", severity: warning }
  - interval: 1m
    input_series:
      - series: 'myknow_pve_collected_seconds{environment="operations",vm="host"}'
        values: '0+60x10'
      - series: 'myknow_pve_system_disk_healthy{environment="operations",vm="host"}'
        values: '0+0x10'
    alert_rule_test:
      - eval_time: 3m
        alertname: PveHostCollectorStale
        exp_alerts: []
      - eval_time: 3m
        alertname: PveDiskUnhealthy
        exp_alerts:
          - exp_labels: { environment: operations, vm: host, severity: critical }
  - interval: 1m
    input_series:
      - series: 'caddy_http_request_duration_seconds_count{job="caddy",environment="operations",vm="5202",server="srv0",handler="reverse_proxy",method="GET",code="200"}'
        values: '0+60x30'
      - series: 'caddy_http_request_duration_seconds_count{job="caddy",environment="operations",vm="5202",server="srv0",handler="reverse_proxy",method="GET",code="502"}'
        values: '0+0x10 0+12x20'
      - series: 'caddy_http_request_duration_seconds_count{job="caddy",environment="operations",vm="5202",server="srv0",handler="static_response",method="GET",code="503"}'
        values: '0+600x30'
    alert_rule_test:
      - eval_time: 8m
        alertname: ServerErrorBurst
        exp_alerts: []
      - eval_time: 25m
        alertname: ServerErrorBurst
        exp_alerts:
          - exp_labels: { severity: warning, environment: operations, vm: "5202" }
  - interval: 1m
    input_series:
      - series: 'caddy_http_request_duration_seconds_count{job="caddy",environment="operations",vm="5202",server="srv0",handler="reverse_proxy",method="GET",code="500"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: ServerErrorBurst
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'ssartnership_app_ready_success{job="telemetry",environment="production",vm="5200",dependency="database"}'
        values: '1 1 0 0 0 0 1 1'
      - series: 'ssartnership_app_ready_success{job="telemetry",environment="production",vm="5200",dependency="storage"}'
        values: '1+0x7'
      - series: 'ssartnership_app_ready_success{job="telemetry",environment="preview",vm="5201",dependency="gateway"}'
        values: '0+0x7'
    alert_rule_test:
      - eval_time: 3m
        alertname: AppDependencyUnavailable
        exp_alerts:
          - exp_labels: { job: telemetry, environment: preview, vm: "5201", dependency: gateway, severity: warning }
      - eval_time: 5m
        alertname: AppDependencyUnavailable
        exp_alerts:
          - exp_labels: { job: telemetry, environment: production, vm: "5200", dependency: database, severity: critical }
          - exp_labels: { job: telemetry, environment: preview, vm: "5201", dependency: gateway, severity: warning }
      - eval_time: 7m
        alertname: AppDependencyUnavailable
        exp_alerts:
          - exp_labels: { job: telemetry, environment: preview, vm: "5201", dependency: gateway, severity: warning }
