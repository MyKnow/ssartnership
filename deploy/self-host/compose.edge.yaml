# Public edge overlay. Keep this stopped until DNS, firewall forwarding, and
# external backup/restore gates are independently verified.
name: ssartnership-edge
services:
  caddy:
    platform: linux/amd64
    image: caddy:2.11.4@sha256:98eb57d882ccd5213d1688764db10c1ca2c58a1ca3a6717a3411ad798f7a423a
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    logging:
      driver: local
      options: { max-size: 10m, max-file: "3" }
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    tmpfs:
      - /tmp:mode=1777
    networks: [original_edge]
    healthcheck:
      test: [CMD, caddy, validate, --config, /etc/caddy/Caddyfile, --adapter, caddyfile]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  caddy-data:
  caddy-config:

networks:
  original_edge:
    external: true
    name: ssartnership-original-preview-34141078185_edge
