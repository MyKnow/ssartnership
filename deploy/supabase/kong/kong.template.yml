_format_version: "2.1"
_transform: true
consumers:
  - username: anon
    keyauth_credentials: [{ key: $SUPABASE_ANON_KEY }]
  - username: service_role
    keyauth_credentials: [{ key: $SUPABASE_SERVICE_KEY }]
acls:
  - consumer: anon
    group: anon
  - consumer: service_role
    group: admin
services:
  - name: rest-v1
    url: http://rest:3000/
    routes: [{ name: rest-v1-all, strip_path: true, paths: [/rest/v1/] }]
    plugins:
      - name: cors
      - name: key-auth
        config: { hide_credentials: false }
      - name: request-transformer
        config:
          add: { headers: ["Authorization: $LUA_AUTH_EXPR"] }
          replace: { headers: ["Authorization: $LUA_AUTH_EXPR"] }
      - name: acl
        config: { hide_groups_header: true, allow: [admin, anon] }
  # No key-auth here: signed Storage downloads intentionally lack apikey.
  - name: storage-v1
    url: http://storage:5000/
    routes: [{ name: storage-v1-all, strip_path: true, paths: [/storage/v1/] }]
    plugins:
      - name: cors
      - name: request-transformer
        config:
          add: { headers: ["Authorization: $LUA_AUTH_EXPR"] }
          replace: { headers: ["Authorization: $LUA_AUTH_EXPR"] }
      - name: post-function
        config:
          access:
            - |
              local auth = kong.request.get_header("authorization")
              if auth == nil or auth == "" or auth:find("^%s*$") then
                kong.service.request.clear_header("authorization")
              end
