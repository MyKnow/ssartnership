# Install as /etc/systemd/system/ssartnership-production-backup.service.d/online.conf
# only after the live capture, encrypted Mac round-trip and restore succeed.
[Service]
ExecStart=
# Keep the shared exclusive lock, with the same bounded wait as cold backup.
ExecStart=/usr/bin/flock --timeout 300 --conflict-exit-code 75 /var/lib/ssartnership-ci/heavy.lock /opt/ssartnership/node24/node /opt/ssartnership/operator-online-20260910/scripts/self-host-operations/production-online-backup.mjs capture
ExecStopPost=
TimeoutStartSec=30min
MemoryMax=1536M
